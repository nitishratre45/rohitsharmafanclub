name: Refresh Rohit News
on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh_news.py"
      - ".github/workflows/refresh-news.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rohit-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh articles from ESPNcricinfo RSS
        run: python scripts/refresh_news.py
      - name: Commit feed changes
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No new Rohit-related RSS articles; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: refresh Rohit news feed"
          git push

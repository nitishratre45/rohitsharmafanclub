name: Rohit FanClub Site Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rohit-site-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required pages and modules
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html home/style.css home/app.css home/app.js data/rohit-profile.json data/career-stats.json data/photo-albums.json data/matches.json data/records.json stats/index.html stats/Batting/index.html stats/Bowling/index.html stats/Explore/index.html stats/Style/stats.css stats/Script/stats-data.js stats/Script/batting.js stats/Script/explorer.js photos/index.html matches/index.html records/index.html news/index.html videos/index.html admin/index.html; do
            test -s "$file" || { echo "::error::Missing or empty required file: $file"; exit 1; }
          done
          python - <<'PY'
          import json
          for path in ("data/rohit-profile.json", "data/career-stats.json", "data/photo-albums.json", "data/matches.json", "data/records.json"):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              print("JSON OK:", path)
          stats = json.load(open("data/career-stats.json", encoding="utf-8"))
          assert stats.get("player") == "Rohit Sharma"
          assert stats.get("formats"), "Career stats formats are missing"
          for row in stats["formats"]:
              assert row.get("format"), "Format name missing"
              assert isinstance(row.get("runs"), (int, float)), "Runs must be numeric"
          html = open("index.html", encoding="utf-8").read()
          assert "Rohit Sharma" in html
          assert "tilakvarmafanclub" not in html.lower()
          print("Homepage identity and stats schema checks passed")
          PY
